name: cs
description: Церковнославянский словарь, чтение и изучение языка.
publish_to: none
version: 0.1.2+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/LICENSE.txt
    - assets/fonts/Shafarik-OFL.txt
    - assets/branding/app-icon.png
  fonts:
    - family: Monomakh
      fonts:
        - asset: assets/fonts/MonomakhUnicode.otf
    - family: OldStandard
      fonts:
        - asset: assets/fonts/OldStandard-Regular.otf

    - family: Shafarik
      fonts:
        - asset: assets/fonts/Shafarik-Regular.otf
