# Public corpus pilot only; all other API and portal policies remain in their existing locations.
location ^~ /api/v2/study/reader/v1/index/ {
    limit_req zone=typikon_reader burst=20 nodelay;
    limit_req_status 429;
    error_page 429 = @typikon_index_limited;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location @typikon_index_limited {
    default_type application/json;
    add_header Retry-After 1 always;
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control no-store always;
    return 429 '{"contract":"cs-index/1","error":{"code":"rate_limited","message":"Бюджет чтения пилота исчерпан.","retryable":true}}';
}
location ^~ /api/v2/study/reader/v1/ {
    limit_req zone=typikon_reader burst=20 nodelay;
    limit_req_status 429;
    error_page 429 = @typikon_reader_limited;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location @typikon_reader_limited {
    default_type application/json;
    add_header Retry-After 1 always;
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control no-store always;
    return 429 '{"contract":"cs-reader/1","error":{"code":"rate_limited","message":"Бюджет чтения пилота исчерпан.","retryable":true}}';
}
